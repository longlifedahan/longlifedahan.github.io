<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f1c">
  <link rel="icon" href="data:,">
  <title>🎨 旋转画板</title>
  <link rel="stylesheet" href="style.css">
  <!-- 注意：B站 SDK 一律由 game.js 动态异步加载，绝不能同步阻塞页面渲染 -->
</head>
<body>
  <div id="app">

    <!-- ============ 顶部 ============ -->
    <header class="top">
      <h1 class="top-title">🎨 旋转画板</h1>
      <p class="top-sub">点按圆盘落笔，图案随圆盘一起旋转</p>
    </header>

    <!-- ============ 圆盘画布 ============ -->
    <main class="stage">
      <div class="board-wrap">
        <canvas id="board"></canvas>
        <svg id="spin-arrow" class="spin-arrow">
          <path id="arrow-path"></path>
        </svg>
      </div>
      <div class="hint">在圆盘上按住拖动即可作画</div>
    </main>

    <!-- ============ 底部工具栏 ============ -->
    <footer class="toolbar">
      <div class="trow">
        <button class="tbtn tbtn-toggle active" id="btn-spin">⏸ 暂停</button>
        <button class="tbtn" id="btn-undo" disabled>↩ 撤销</button>
        <button class="tbtn tbtn-danger" id="btn-clear">🗑 清空</button>
        <button class="tbtn tbtn-main" id="btn-export">📤 导出</button>
      </div>

      <div class="panel">
        <div class="cgroup">
          <span class="clabel">转速</span>
          <input type="range" id="speed-slider" class="range-slider" min="0" max="10" step="0.1" value="1">
          <span class="range-val" id="speed-val">1</span>
        </div>
        <div class="cgroup">
          <span class="clabel">方向</span>
          <button type="button" class="dirbtn active" id="btn-dir">↻ 顺时针</button>
        </div>
        <div class="cgroup">
          <span class="clabel">笔触</span>
          <input type="range" id="size-slider" class="range-slider" min="1" max="12" step="0.1" value="5.5">
          <span class="range-val" id="size-val">5.5</span>
        </div>
        <div class="cgroup">
          <span class="clabel">底色</span>
          <div class="swatches" id="bg-swatches">
            <button type="button" class="swatch active" data-group="bg" data-color="#ffffff" style="background:#ffffff"></button>
            <button type="button" class="swatch" data-group="bg" data-color="#eef1f5" style="background:#eef1f5"></button>
            <button type="button" class="swatch" data-group="bg" data-color="#ffe3e9" style="background:#ffe3e9"></button>
            <button type="button" class="swatch" data-group="bg" data-color="#dceeff" style="background:#dceeff"></button>
            <button type="button" class="swatch" data-group="bg" data-color="#fff3d6" style="background:#fff3d6"></button>
            <button type="button" class="swatch" data-group="bg" data-color="#efe6ff" style="background:#efe6ff"></button>
            <button type="button" class="swatch" data-group="bg" data-color="#e2f7e2" style="background:#e2f7e2"></button>
          </div>
          <input type="color" id="bg-picker" class="picker" value="#ffffff" title="吸色">
        </div>
        <div class="cgroup">
          <span class="clabel">画笔</span>
          <div class="swatches" id="ink-swatches">
            <button type="button" class="swatch active" data-group="ink" data-color="#111111" style="background:#111111"></button>
            <button type="button" class="swatch" data-group="ink" data-color="#ffffff" style="background:#ffffff"></button>
            <button type="button" class="swatch" data-group="ink" data-color="#ff4d4f" style="background:#ff4d4f"></button>
            <button type="button" class="swatch" data-group="ink" data-color="#ff9400" style="background:#ff9400"></button>
            <button type="button" class="swatch" data-group="ink" data-color="#ffd600" style="background:#ffd600"></button>
            <button type="button" class="swatch" data-group="ink" data-color="#2ec96b" style="background:#2ec96b"></button>
            <button type="button" class="swatch" data-group="ink" data-color="#3b7cff" style="background:#3b7cff"></button>
            <button type="button" class="swatch" data-group="ink" data-color="#a05cff" style="background:#a05cff"></button>
            <button type="button" class="swatch" data-group="ink" data-color="#ff5fa8" style="background:#ff5fa8"></button>
          </div>
          <input type="color" id="ink-picker" class="picker" value="#111111" title="吸色">
        </div>
        <div class="cgroup">
          <span class="clabel">底图</span>
          <button type="button" class="imgbtn" id="btn-bgimg">🖼 上传底图</button>
          <button type="button" class="imgbtn imgbtn-clear" id="btn-bgimg-clear" hidden>✕ 清除</button>
        </div>
      </div>
    </footer>

  </div>

  <div id="toast" class="toast" hidden></div>
  <input type="file" id="file-img" accept="image/*" hidden>

  <!-- 自定义确认弹层（Toy WebView 弹不出原生 alert/confirm，必须用 DOM 弹层） -->
  <div id="confirm-mask" class="confirm-mask" hidden>
    <div class="confirm-box">
      <p class="confirm-text" id="confirm-text">确定清空全部笔迹吗？</p>
      <div class="confirm-btns">
        <button type="button" class="confirm-btn cancel" id="confirm-cancel">取消</button>
        <button type="button" class="confirm-btn ok" id="confirm-ok">确认清空</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
