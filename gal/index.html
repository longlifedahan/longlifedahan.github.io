<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>寻找你最合适的虚拟主播伴侣</title>
<style>
:root {
  --pink-50: #FFF0F5;
  --pink-100: #FFE4EC;
  --pink-200: #FFC0D5;
  --pink-300: #FF9EBD;
  --pink-400: #FF7BA6;
  --pink-500: #FF5C8E;
  --pink-600: #FF3D76;
  --pink-700: #E83168;
  --pink-800: #C42855;
  --pink-900: #8B1A3D;
  --text: #3D1028;
  --text-light: #7A5068;
  --white: #FFFFFF;
  --shadow: 0 4px 20px rgba(255,92,142,0.25);
  --shadow-lg: 0 8px 40px rgba(255,92,142,0.35);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family: 'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  background: linear-gradient(135deg, var(--pink-50) 0%, #FFE0EC 30%, var(--pink-100) 60%, #FFF0F5 100%);
  background-attachment: fixed;
  min-height: 100vh;
  color: var(--text);
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
body::before{
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background:
    radial-gradient(circle at 15% 20%, rgba(255,156,189,0.15) 0%, transparent 50%),
    radial-gradient(circle at 85% 60%, rgba(255,92,142,0.1) 0%, transparent 50%),
    radial-gradient(circle at 50% 80%, rgba(255,128,170,0.12) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* Floating hearts */
.hearts-container{
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.heart-float{
  position: absolute;
  animation: floatUp linear infinite;
  opacity: 0.3;
  font-size: 24px;
}
@keyframes floatUp{
  0%{transform:translateY(100vh) rotate(0deg) scale(0);opacity:0;}
  10%{opacity:0.3;}
  90%{opacity:0.3;}
  100%{transform:translateY(-10vh) rotate(360deg) scale(1);opacity:0;}
}

/* BGM Toggle */
.bgm-btn{
  position: fixed;
  top: 16px;
  right: 16px;
  z-index: 100;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 2px solid var(--pink-300);
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(8px);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
  box-shadow: 0 2px 12px rgba(255,92,142,0.15);
  -webkit-appearance: none;
  outline: none;
  padding: 0;
}
.bgm-btn:hover{transform:scale(1.1);box-shadow:0 4px 20px rgba(255,92,142,0.25);}
.bgm-on{opacity:1;}
.bgm-off{opacity:0.45;}

/* Main container */
.container{
  max-width: 600px;
  margin: 0 auto;
  padding: 12px 20px;
  position: relative;
  z-index: 1;
}
.result-screen .container{padding: 12px 20px 40px;}

/* Screen management */
.screen{display:none;}
.screen.active{display:block;}

/* Welcome Screen */
.welcome-screen{
  text-align: center;
  padding-top: 24px;
}
.welcome-logo{
  width: 100px;
  height: 100px;
  background: linear-gradient(135deg, var(--pink-300), var(--pink-500));
  border-radius: 50%;
  margin: 0 auto 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 50px;
  box-shadow: var(--shadow-lg);
  animation: logoPulse 2s ease-in-out infinite;
}
@keyframes logoPulse{
  0%,100%{transform:scale(1);box-shadow:0 8px 40px rgba(255,92,142,0.35);}
  50%{transform:scale(1.05);box-shadow:0 12px 50px rgba(255,92,142,0.5);}
}
.welcome-title{
  font-size: 26px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--pink-600), var(--pink-800));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 12px;
  line-height: 1.4;
}
.welcome-subtitle{
  font-size: 14px;
  color: var(--text-light);
  margin-bottom: 16px;
  line-height: 1.5;
}
.welcome-card{
  background: var(--white);
  border-radius: 18px;
  padding: 16px 20px;
  box-shadow: var(--shadow);
  margin-bottom: 18px;
}
.welcome-card p{
  font-size: 13px;
  color: var(--text-light);
  line-height: 1.6;
  text-align: left;
}
.welcome-card .dim-list{
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-top: 16px;
}
.dim-tag{
  display: inline-block;
  padding: 5px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
  background: var(--pink-100);
  color: var(--pink-700);
}

/* Buttons */
.btn{
  display: inline-block;
  padding: 14px 40px;
  border: none;
  border-radius: 50px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
  -webkit-appearance: none;
  outline: none;
}
.btn:active{transform:scale(0.96);}
.btn-primary{
  background: linear-gradient(135deg, var(--pink-500), var(--pink-600));
  color: white;
  box-shadow: 0 6px 24px rgba(255,61,118,0.4);
}
.btn-primary:hover{
  box-shadow: 0 8px 32px rgba(255,61,118,0.55);
  transform: translateY(-2px);
}
.btn-outline{
  background: white;
  color: var(--pink-600);
  border: 2px solid var(--pink-300);
}
.btn-sm{
  padding: 10px 28px;
  font-size: 14px;
}

/* Question Screen */
.question-screen{padding-top: 8px;}
.progress-wrap{
  background: var(--pink-100);
  border-radius: 20px;
  height: 8px;
  margin-bottom: 8px;
  overflow: hidden;
}
.progress-bar{
  height: 100%;
  background: linear-gradient(90deg, var(--pink-400), var(--pink-600));
  border-radius: 20px;
  transition: width 0.5s ease;
}
.progress-text{
  text-align: right;
  font-size: 12px;
  color: var(--text-light);
  margin-bottom: 12px;
}
.question-number{
  font-size: 12px;
  color: var(--pink-500);
  font-weight: 600;
  margin-bottom: 4px;
  letter-spacing: 2px;
}
.question-title{
  font-size: 19px;
  font-weight: 700;
  line-height: 1.4;
  margin-bottom: 14px;
  color: var(--text);
}
.options-list{
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.option-btn{
  display: flex;
  align-items: center;
  background: var(--white);
  border: 2px solid var(--pink-100);
  border-radius: 14px;
  padding: 11px 14px;
  cursor: pointer;
  transition: all 0.25s ease;
  text-align: left;
  font-size: 14px;
  color: var(--text);
  line-height: 1.4;
  -webkit-appearance: none;
  outline: none;
  font-family: inherit;
}
.option-btn:hover{
  border-color: var(--pink-400);
  background: #FFF5F8;
  transform: translateX(4px);
}
.option-btn:active{
  transform: scale(0.98);
  background: var(--pink-100);
}
.option-letter{
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--pink-100);
  color: var(--pink-600);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 12px;
  margin-right: 10px;
  flex-shrink: 0;
  transition: all 0.25s ease;
}
.option-btn:hover .option-letter{
  background: var(--pink-500);
  color: white;
}
.option-selected{
  border-color: var(--pink-500) !important;
  background: #FFF0F5 !important;
}
.option-selected .option-letter{
  background: var(--pink-500);
  color: white;
}
.nav-buttons{
  margin-top: 10px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
}
.btn-back{
  padding: 10px 24px !important;
}
#btnSubmit{
  width: 100%;
  max-width: 320px;
  margin: 0 auto;
  display: block;
}

/* Result Screen */
.result-screen{padding-top: 20px;}
.result-header{
  text-align: center;
  margin-bottom: 32px;
}
.result-title{
  font-size: 26px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--pink-500), var(--pink-700));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}
.result-subtitle{
  font-size: 14px;
  color: var(--text-light);
}

/* Best Match Card */
.best-match-card{
  background: linear-gradient(135deg, #FFF0F5, #FFE4EC);
  border: 2px solid var(--pink-300);
  border-radius: 24px;
  padding: 28px;
  text-align: center;
  margin-bottom: 24px;
  box-shadow: var(--shadow-lg);
  position: relative;
  overflow: hidden;
}
.best-match-card::before{
  content: 'BEST MATCH';
  position: absolute;
  top: 12px; right: -28px;
  background: var(--pink-500);
  color: white;
  font-size: 10px;
  font-weight: 700;
  padding: 4px 36px;
  transform: rotate(45deg);
  letter-spacing: 2px;
}
.best-avatar{
  width: 100px;
  height: 100px;
  border-radius: 50%;
  border: 5px solid var(--pink-300);
  object-fit: cover;
  margin-bottom: 16px;
  box-shadow: 0 4px 16px rgba(255,92,142,0.3);
}
.best-name{
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 4px;
}
.best-similarity{
  font-size: 36px;
  font-weight: 800;
  background: linear-gradient(135deg, var(--pink-500), var(--pink-700));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.best-similarity span{font-size:16px;font-weight:500;}

/* Radar Chart */
.radar-card{
  background: var(--white);
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 24px;
  box-shadow: var(--shadow);
}
.radar-title{
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 16px;
  text-align: center;
  color: var(--text);
}
.radar-wrap{
  display: flex;
  justify-content: center;
}
canvas{max-width:100%;height:auto;}

/* Top 5 List */
.match-list{
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 32px;
}
.match-card{
  background: var(--white);
  border-radius: 18px;
  padding: 16px 18px;
  box-shadow: 0 2px 16px rgba(255,92,142,0.1);
  transition: transform 0.2s;
  overflow: hidden;
}
.match-card:hover{transform:translateX(4px);}
.match-card-header{
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
.match-rank{
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 14px;
  flex-shrink: 0;
}
.rank-1{background:#FFD700;color:#8B6914;}
.rank-2{background:#C0C0C0;color:#555;}
.rank-3{background:#CD7F32;color:#fff;}
.rank-4,.rank-5{background:var(--pink-100);color:var(--pink-600);}
.match-avatar{
  width: 44px;
  height: 44px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--pink-200);
  flex-shrink: 0;
}
.match-info{flex:1;min-width:0;}
.match-name{font-size:15px;font-weight:600;margin-bottom:1px;}
.match-desc{font-size:11px;color:var(--text-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.match-score-col{text-align:center;flex-shrink:0;}
.match-score{
  font-size: 22px;
  font-weight: 700;
  color: var(--pink-600);
  display: block;
  line-height: 1;
}
.match-score-label{font-size:10px;color:var(--text-light);}
.match-traits-bars{
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding-top: 10px;
  border-top: 1px solid var(--pink-100);
}
.match-trait-row{
  display: flex;
  align-items: center;
  gap: 6px;
}
.match-trait-icon{font-size:13px;flex-shrink:0;width:20px;text-align:center;}
.match-trait-name{font-size:11px;color:var(--text-light);width:38px;flex-shrink:0;}
.match-trait-track{
  flex:1;
  height: 12px;
  background: #F0F0F0;
  border-radius: 6px;
  overflow: hidden;
}
.match-trait-fill{
  height: 100%;
  border-radius: 6px;
  transition: width 0.8s ease;
}
.match-trait-val{
  font-size: 11px;
  font-weight: 600;
  color: var(--text);
  width: 16px;
  flex-shrink: 0;
  text-align: right;
}

/* Bilibili links */
.bili-link{
  display: inline-block;
  margin-top: 10px;
  padding: 6px 18px;
  background: linear-gradient(135deg, #FB7299, #FF5C8E);
  color: #fff;
  border-radius: 20px;
  font-size: 13px;
  text-decoration: none;
  font-weight: 500;
  transition: all 0.2s;
}
.bili-link:hover{transform:scale(1.05);box-shadow:0 4px 16px rgba(251,114,153,0.4);}
.bili-link-sm{
  display: block;
  text-align: center;
  margin-top: 10px;
  padding: 6px 0;
  color: var(--pink-500);
  font-size: 12px;
  text-decoration: none;
  font-weight: 500;
  border-radius: 10px;
  transition: all 0.2s;
  background: var(--pink-50);
}
.bili-link-sm:hover{background:var(--pink-100);color:var(--pink-700);}

/* Your vector section */
.your-vector-card{
  background: var(--white);
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 24px;
  box-shadow: var(--shadow);
}
.vector-title{
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 12px;
  text-align: center;
}
.vector-bars{display:flex;flex-direction:column;gap:8px;}
.vector-bar-row{
  display: flex;
  align-items: center;
  gap: 10px;
}
.vector-bar-label{
  width: 50px;
  font-size: 12px;
  color: var(--text-light);
  text-align: right;
  flex-shrink: 0;
}
.vector-bar-track{
  flex:1;
  height: 20px;
  background: var(--pink-100);
  border-radius: 10px;
  overflow: hidden;
  position: relative;
}
.vector-bar-fill{
  height: 100%;
  border-radius: 10px;
  background: linear-gradient(90deg, var(--pink-400), var(--pink-600));
  transition: width 0.8s ease;
  position: relative;
}
.vector-bar-fill::after{
  content: attr(data-val);
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 10px;
  color: white;
  font-weight: 600;
}
.vector-bar-val{
  width: 36px;
  font-size: 12px;
  font-weight: 600;
  color: var(--pink-700);
  flex-shrink: 0;
}

/* Retry button */
.retry-wrap{text-align:center;margin-bottom:40px;}

/* Footer */
.footer{
  text-align: center;
  padding: 20px;
  font-size: 12px;
  color: var(--text-light);
  opacity: 0.7;
}

/* Animations */
@keyframes fadeInUp{
  from{opacity:0;transform:translateY(30px);}
  to{opacity:1;transform:translateY(0);}
}
.animate-in{animation:fadeInUp 0.5s ease forwards;}

/* Responsive */
@media(max-width:420px){
  .welcome-screen{padding-top:12px;}
  .welcome-logo{width:70px;height:70px;font-size:34px;margin-bottom:12px;}
  .welcome-title{font-size:20px;margin-bottom:6px;}
  .welcome-subtitle{font-size:13px;margin-bottom:10px;}
  .welcome-card{margin-bottom:10px;padding:12px 16px;}
  .welcome-card .dim-list{gap:5px;margin-top:10px;}
  .dim-tag{padding:3px 10px;font-size:11px;}
  .question-title{font-size:17px;}
  .option-btn{padding:10px 12px;font-size:13px;}
  .best-similarity{font-size:28px;}
  .best-avatar{width:80px;height:80px;}
}
</style>
</head>
<body>

<!-- BGM toggle -->
<audio id="bgmAudio" src="bgm/bgm.mp3" loop preload="auto"></audio>
<button id="bgmToggle" class="bgm-btn bgm-on" onclick="toggleBgm()" title="背景音乐">🎵</button>

<div class="hearts-container" id="heartsContainer"></div>

<div class="container">

  <!-- ===== WELCOME SCREEN ===== -->
  <div class="screen active" id="welcomeScreen">
    <div class="welcome-screen">
      <div class="welcome-logo">🎀</div>
      <h1 class="welcome-title">寻找你最合适的<br>虚拟主播伴侣</h1>
      <p class="welcome-subtitle">回答一些问题，发现与你灵魂最契合的虚拟主播</p>
      <div class="welcome-card">
        <p>我们将从以下维度为你匹配：</p>
        <div class="dim-list">
          <span class="dim-tag">🎭 抽象力</span>
          <span class="dim-tag">🌸 温柔度</span>
          <span class="dim-tag">✨ 热水器</span>
          <span class="dim-tag">💍 忠贞度</span>
          <span class="dim-tag">⚡ 元气值</span>
	          <span class="dim-tag">🎤 才艺值</span>
        </div>
        <p style="margin-top:14px;text-align:center;">共计 30 位人气虚拟主播等你来匹配 ✨</p>
      </div>
      <div class="welcome-card mode-select">
        <p style="text-align:center;font-weight:600;color:var(--text);margin-bottom:12px;">选择测试模式</p>
        <button class="btn btn-primary" onclick="startQuiz(10)" style="width:100%;margin-bottom:10px;">✨ 简单模式（10 题）</button>
        <button class="btn btn-outline" onclick="startQuiz(20)" style="width:100%;margin-bottom:10px;">🔍 深度模式（20 题）</button>
        <p id="globalStats" style="text-align:center;font-size:12px;color:var(--text-light);padding-top:8px;border-top:1px solid var(--pink-100);display:none;"></p>
      </div>
    </div>
  </div>

  <!-- ===== QUESTION SCREEN ===== -->
  <div class="screen" id="questionScreen">
    <div class="question-screen">
      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar" style="width:0%"></div>
      </div>
      <div class="progress-text" id="progressText"></div>
      <div class="question-number" id="questionNumber"></div>
      <div class="question-title animate-in" id="questionTitle"></div>
      <div class="options-list" id="optionsList"></div>
      <div class="nav-buttons" id="navButtons">
        <button class="btn btn-outline btn-sm btn-back" id="btnPrev" onclick="goBack()" style="display:none">← 上一题</button>
        <button class="btn btn-outline btn-sm btn-back" id="btnNext" onclick="goNext()" style="display:none">下一题 →</button>
        <button class="btn btn-primary" id="btnSubmit" onclick="confirmSubmit()" style="display:none;margin-top:12px;">✅ 确认提交</button>
      </div>
    </div>
  </div>

  <!-- ===== RESULT SCREEN ===== -->
  <div class="screen" id="resultScreen">
    <div class="result-screen">
      <div class="result-header animate-in">
        <h2 class="result-title">你的最佳虚拟主播伴侣</h2>
        <p class="result-subtitle">基于你的选择，以下是与你最契合的主播</p>
      </div>

      <div class="best-match-card animate-in" id="bestMatchCard"></div>

      <div class="your-vector-card animate-in">
        <div class="vector-title">📊 你的特质画像</div>
        <div class="vector-bars" id="userVectorBars"></div>
      </div>

      <div class="radar-card animate-in">
        <div class="radar-title">🎯 你 vs TOP1 特质对比</div>
        <div class="radar-wrap">
          <canvas id="radarChart" width="320" height="320"></canvas>
        </div>
      </div>

      <div class="match-list animate-in" id="matchList"></div>

      <div class="retry-wrap">
        <button class="btn btn-primary" id="btnExport" onclick="exportResult()" style="margin-right:12px;display:none;">📸 导出长图</button>
        <button class="btn btn-outline" onclick="retryQuiz()">🔄 重新测试</button>
      </div>
    </div>
  </div>

</div>

<script>
// ==================== DATA ====================

// Trait dimension names (display)
const DIM_NAMES = ['抽象力', '温柔度', '热水器', '忠贞度', '元气值', '才艺值'];
const DIM_ICONS = ['🎭', '🌸', '✨', '💍', '⚡', '🎤'];
const DIM_COLORS = ['#FF6B6B', '#FF9EBD', '#C084FC', '#60A5FA', '#FBBF24', '#FFD700'];

// 30 VTubers with trait values [抽象, 温柔, 热水器, 忠贞, 元气, 才艺]
const VTUBERS = [

// ==================== STATE ====================
let currentQuestion = 0;
let userVector = [0, 0, 0, 0, 0, 0];
let maxPossible = [0, 0, 0, 0, 0, 0];
let answers = [];
let shuffledQuestions = [];
const OPTION_LABELS = ['A', 'B', 'C', 'D'];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ==================== HELPERS ====================
function normalize(vec) {
  const norm = Math.sqrt(vec.reduce((s, v) => s + v * v, 0));
  if (norm === 0) return vec.map(() => 0);
  return vec.map(v => v / norm);
}

function cosineSimilarity(a, b) {
  let dot = 0, na = 0, nb = 0;
  for (let i = 0; i < a.length; i++) {
    dot += a[i] * b[i];
    na += a[i] * a[i];
    nb += b[i] * b[i];
  }
  if (na === 0 || nb === 0) return 0;
  return dot / (Math.sqrt(na) * Math.sqrt(nb));
}

// Property difference scoring per dimension
// diff 0-1=5分, 2=4分, 3=2分, 4-5=0分, 6=-1分, 7=-2分, 8=-3分, 9=-4分, 10=-5分
function propertyScore(userDisplay, vtuberTraits) {
  let total = 0;
  for (let i = 0; i < 6; i++) {
    const diff = Math.abs(Math.round(userDisplay[i]) - vtuberTraits[i]);
    if (diff <= 1) total += 5;
    else if (diff === 2) total += 4;
    else if (diff === 3) total += 2;
    else if (diff <= 5) total += 0;
    else if (diff === 6) total += -1;
    else if (diff === 7) total += -2;
    else if (diff === 8) total += -3;
    else if (diff === 9) total += -4;
    else total += -5; // diff === 10
  }
  return total;
}

function getAvatarUrl(vtuber) {
  return 'images/' + vtuber.id + '.jpg';

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');

function toPercent(val) {

// ==================== START QUIZ ====================
function startQuiz(questionCount) {
  currentQuestion = 0;
  userVector = [0, 0, 0, 0, 0, 0];
  // Randomly pick N from 30, shuffle order and options, reassign IDs 1-N
  var picked = shuffle(QUESTIONS).slice(0, questionCount);
  shuffledQuestions = picked.map(function(q, idx) {
    var src = q.options.map(function(o) { return { opt: o }; });
    var shf = shuffle(src);
    return {
      id: idx + 1,  // sequential 1-N
      text: q.text,
      options: shf.map(function(s) { return s.opt; })
    };
  });
  answers = new Array(shuffledQuestions.length).fill(-1);

  // Calculate max possible score per dimension for these questions
  maxPossible = [0, 0, 0, 0, 0, 0];
  shuffledQuestions.forEach(function(q) {
    var dimMax = [0, 0, 0, 0, 0, 0];
    q.options.forEach(function(opt) {
      for (var i = 0; i < 6; i++) {
        if (opt.vec[i] > dimMax[i]) dimMax[i] = opt.vec[i];
      }
    });
    for (var i = 0; i < 6; i++) {
      maxPossible[i] += dimMax[i];
    }
  });

  showScreen('questionScreen');
  renderQuestion();
}

// ==================== RENDER QUESTION ====================
function renderQuestion() {
  const q = shuffledQuestions[currentQuestion];
  document.getElementById('questionNumber').textContent = `QUESTION ${q.id}`;
  document.getElementById('questionTitle').textContent = q.text;
  document.getElementById('progressText').textContent = `${currentQuestion + 1} / ${shuffledQuestions.length}`;
  document.getElementById('progressBar').style.width = ((currentQuestion / shuffledQuestions.length) * 100) + '%';

  // Show/hide nav buttons
  const btnPrev = document.getElementById('btnPrev');
  const btnNext = document.getElementById('btnNext');
  const btnSubmit = document.getElementById('btnSubmit');
  btnPrev.style.display = currentQuestion > 0 ? 'inline-block' : 'none';
  // Show next button if going back to an already-answered question that isn't the last
  btnNext.style.display = (answers[currentQuestion] >= 0 && currentQuestion < shuffledQuestions.length - 1) ? 'inline-block' : 'none';
  // Show submit button only on last question when answered (and not yet submitted)
  if (currentQuestion === shuffledQuestions.length - 1 && answers[currentQuestion] >= 0) {
    btnSubmit.style.display = 'block';
  } else {
    btnSubmit.style.display = 'none';
  }

  const prevAnswer = answers[currentQuestion];
  const list = document.getElementById('optionsList');
  list.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    if (i === prevAnswer) btn.classList.add('option-selected');
    btn.innerHTML = `<span class="option-letter">${OPTION_LABELS[i]}</span>${opt.text}`;
    btn.addEventListener('click', () => selectOption(i));
    list.appendChild(btn);
  });

  // Re-trigger animation
  const title = document.getElementById('questionTitle');
  title.classList.remove('animate-in');
  void title.offsetWidth;
  title.classList.add('animate-in');
}

function selectOption(index) {
  const prevAnswer = answers[currentQuestion];
  // If re-selecting, subtract old answer's vector first
  if (prevAnswer >= 0) {
    const oldVec = shuffledQuestions[currentQuestion].options[prevAnswer].vec;
    for (let i = 0; i < 6; i++) {
      userVector[i] -= oldVec[i];
    }
  }

  // Add new answer
  const vec = shuffledQuestions[currentQuestion].options[index].vec;
  for (let i = 0; i < 6; i++) {
    userVector[i] += vec[i];
  }
  answers[currentQuestion] = index;

  currentQuestion++;
  if (currentQuestion >= shuffledQuestions.length) {
    // On last question, stay put and show submit button
    currentQuestion = shuffledQuestions.length - 1;
    renderQuestion();
    document.getElementById('btnSubmit').style.display = 'block';
  } else {
    renderQuestion();
  }
}

function goBack() {
  if (currentQuestion > 0) {
    currentQuestion--;
    renderQuestion();
  }
}

function goNext() {
  if (currentQuestion < shuffledQuestions.length - 1) {
    currentQuestion++;
    renderQuestion();
  }
}

function confirmSubmit() {
  const unanswered = answers.map((a, i) => a < 0 ? (i + 1) : null).filter(Boolean);
  if (unanswered.length > 0) {
    alert('以下题目尚未作答：第 ' + unanswered.join('、') + ' 题\n请完成所有题目后再提交。');
    // Navigate to first unanswered question
    currentQuestion = unanswered[0] - 1;
    renderQuestion();
    return;
  }
  showResults();
}

// ==================== SHOW RESULTS ====================
function showResults() {
  showScreen('resultScreen');

  // Non-negative raw scores, compute per-dimension ratios
  const userDisplay = userVector.map(v => Math.max(0, v));
  const ratios = userDisplay.map((v, i) => {
    const maxV = maxPossible[i] || 1;
    return Math.min(v / maxV, 1);
  });

  // Find the highest ratio, apply power curve to it, then scale ALL dimensions uniformly
  const maxRatio = Math.max(...ratios, 0.01);
  const linearMax = 1 + maxRatio * 9;
  const boostedMax = 1 + Math.pow(maxRatio, 0.55) * 9;
  const scaleFactor = boostedMax / linearMax;

  // All dimensions use the same scale factor — preserves relative proportions
  const userDisplayNorm = ratios.map(r => {
    return (1 + r * 9) * scaleFactor;
  });

  // Normalize for cosine similarity (uses raw vector, not scaled)
  const userNorm = normalize(userVector.map(v => Math.max(0, v)));

  // Calculate combined score: 85% cosine similarity + 15% property difference
  const results = VTUBERS.map(v => {
    const cosSim = cosineSimilarity(userNorm, normalize(v.traits));
    const propRaw = propertyScore(userDisplayNorm, v.traits);
    const propNorm = (propRaw + 30) / 60; // normalize [-30,30] → [0,1]
    return {
      ...v,
      similarity: cosSim * 0.85 + propNorm * 0.15
    };
  }).sort((a, b) => b.similarity - a.similarity);

  const top5 = results.slice(0, 5);
  const best = top5[0];

  // Render best match
  renderBestMatch(best);

  // Render user vector bars
  renderUserVector(userDisplayNorm);

  // Render radar chart
  renderRadarChart(userDisplayNorm, best);

  // Render top 5 list
  renderMatchList(top5, userDisplayNorm);

  // Register this play to the global counter
  registerPlay();
}

function renderRadarChart(userDisplay, best) {
  const canvas = document.getElementById('radarChart');
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;
  const cx = w / 2;
  const cy = h / 2;
  const r = Math.min(cx, cy) - 50;
  const n = 6;

  ctx.clearRect(0, 0, w, h);

  // Draw grid
  for (let level = 1; level <= 4; level++) {
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const angle = (Math.PI * 2 / n) * i - Math.PI / 2;
      const rr = r * (level / 4);
      const x = cx + rr * Math.cos(angle);
      const y = cy + rr * Math.sin(angle);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = '#FFD0E0';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Draw axes
  for (let i = 0; i < n; i++) {
    const angle = (Math.PI * 2 / n) * i - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + r * Math.cos(angle), cy + r * Math.sin(angle));
    ctx.strokeStyle = '#FFB8D0';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Draw labels
  ctx.fillStyle = '#7A5068';
  ctx.font = 'bold 13px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let i = 0; i < n; i++) {
    const angle = (Math.PI * 2 / n) * i - Math.PI / 2;
    const lr = r + 24;
    const x = cx + lr * Math.cos(angle);
    const y = cy + lr * Math.sin(angle);
    ctx.fillText(DIM_NAMES[i], x, y);
  }

  // Draw Best Match polygon (traits are 0-10, scale to 0-1)
  const bestScaled = best.traits.map(v => v / 10);
  drawPolygon(ctx, cx, cy, r, n, bestScaled, 'rgba(255,92,142,0.35)', '#FF3D76', 2.5);

  // Draw User polygon (values are 1-10, scale to 0-1)
  const userScaled = userDisplay.map(v => v / 10);
  drawPolygon(ctx, cx, cy, r, n, userScaled, 'rgba(255,156,189,0.3)', '#FF9EBD', 2);

  // Legend
  ctx.fillStyle = '#FF3D76';
  ctx.fillRect(cx - 50, h - 18, 12, 12);
  ctx.fillStyle = '#7A5068';
  ctx.font = '11px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('最佳匹配 ' + best.name, cx - 34, h - 10);

  ctx.fillStyle = '#FF9EBD';
  ctx.fillRect(cx + 80, h - 18, 12, 12);
  ctx.fillStyle = '#7A5068';
  ctx.fillText('你', cx + 96, h - 10);
}

function drawPolygon(ctx, cx, cy, r, n, values, fill, stroke, lw) {
  ctx.beginPath();
  for (let i = 0; i <= n; i++) {
    const idx = i % n;
    const angle = (Math.PI * 2 / n) * idx - Math.PI / 2;
    const v = Math.min(1, Math.max(0, values[idx]));
    const x = cx + r * v * Math.cos(angle);
    const y = cy + r * v * Math.sin(angle);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.strokeStyle = stroke;
  ctx.lineWidth = lw;
  ctx.stroke();
}

      s.src = '//s1.hdslb.com/bfs/seed/toy/app/sdk/toy-sdk.js';
      s.onload = resolve;

async function exportResult() {
  if (!html2canvasReady || typeof html2canvas === 'undefined') return;
  // Lazy-load SDK in background (non-blocking)
  ensureSdk();
  const el = document.getElementById('resultScreen');
  try {
    const canvas = await html2canvas(el, {
      backgroundColor: '#FFF0F5',
      scale: 2,
      useCORS: false,
      allowTaint: false,

    link.download = '虚拟主播伴侣匹配结果.png';
    link.href = dataUrl;

        var highest = list.length > 0 ? list[0].score : 0;
        return toy.submitScore({ board: 2, score: highest + 1 });
      }).catch(function() {});
    } else {
      var c = parseInt(localStorage.getItem('toy_play_count') || '0', 10) + 1;
      localStorage.setItem('toy_play_count', String(c));
    }
  } catch(e) {}
}

// ==================== INIT ====================
createHearts();
loadGlobalPlayCount();
</script>
